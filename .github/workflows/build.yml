name: Сборка APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Скачать модель русского языка для Tesseract
        run: |
          mkdir -p app/src/main/assets/tessdata
          curl -fL -o app/src/main/assets/tessdata/rus.traineddata \
            https://github.com/tesseract-ocr/tessdata_best/raw/main/rus.traineddata
          ls -la app/src/main/assets/tessdata

      - name: Собрать APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Переименовать APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ManhwaVoice.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ManhwaVoice-apk
          path: ManhwaVoice.apk

      - name: Выложить в Releases (удобно скачать с телефона)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Озвучка манхвы — последняя сборка
          body: Скачайте ManhwaVoice.apk ниже и установите на телефон.
          files: ManhwaVoice.apk
          make_latest: true
