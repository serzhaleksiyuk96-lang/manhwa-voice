name: Сборка APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Скачать модели русского языка для Tesseract (точная и быстрая)
        run: |
          mkdir -p app/src/main/assets/tessdata app/src/main/assets/tessdata_fast
          curl -fL -o app/src/main/assets/tessdata/rus.traineddata \
            https://github.com/tesseract-ocr/tessdata_best/raw/main/rus.traineddata
          curl -fL -o app/src/main/assets/tessdata_fast/rus.traineddata \
            https://github.com/tesseract-ocr/tessdata_fast/raw/main/rus.traineddata
          ls -la app/src/main/assets/tessdata app/src/main/assets/tessdata_fast

      - name: Собрать APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleRelease --no-daemon --stacktrace

      - name: Переименовать APK (с номером версии)
        run: |
          cp app/build/outputs/apk/release/app-release.apk "ManhwaVoice-1.${{ github.run_number }}.apk"
          # Файл с постоянным именем нужен старым версиям приложения для автообновления
          cp app/build/outputs/apk/release/app-release.apk ManhwaVoice.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ManhwaVoice-1.${{ github.run_number }}
          path: ManhwaVoice-1.${{ github.run_number }}.apk

      - name: Удалить прошлый выпуск (чтобы не копились старые файлы)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --cleanup-tag -y --repo "${{ github.repository }}" || true

      - name: Выложить в Releases (удобно скачать с телефона)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Озвучка манхвы 1.${{ github.run_number }}
          body: |
            Скачайте ManhwaVoice-1.${{ github.run_number }}.apk ниже и установите на телефон.
            Если приложение уже установлено, оно предложит обновиться само.

            versionCode=${{ github.run_number }}
          files: |
            ManhwaVoice-1.${{ github.run_number }}.apk
            ManhwaVoice.apk
          make_latest: true
